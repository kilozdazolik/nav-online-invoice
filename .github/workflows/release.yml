# Publishes the gem to RubyGems.org when a version tag (v1.2.3) is pushed.
#
# Uses RubyGems trusted publishing: the GitHub OIDC token is exchanged for a short-lived
# (15 minute) push-only API key, so no long-lived key is stored in the repository.
# The exchange names the gem owner's immutable RubyGems account ID, which RubyGems
# requires when a pending trusted publisher creates a new gem.
#
# Only the publish job can request that key. It runs no third-party code: no actions besides
# checkout, no gem installs, just the runner's own Ruby. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run tests and lint
        run: bundle exec rake spec rubocop
      - name: Check version, tag and changelog
        run: bundle exec rake release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RUBYGEMS_OWNER_ID: "256267"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build gem
        run: gem build nav_online_invoice.gemspec --output "nav_online_invoice-${GITHUB_REF_NAME#v}.gem"

      - name: Exchange OIDC token for a RubyGems API key
        run: |
          ruby -rjson -rnet/http -ruri <<'RUBY'
            oidc_uri = URI("#{ENV.fetch("ACTIONS_ID_TOKEN_REQUEST_URL")}&audience=rubygems.org")
            oidc = Net::HTTP.get_response(oidc_uri, "Authorization" => "bearer #{ENV.fetch("ACTIONS_ID_TOKEN_REQUEST_TOKEN")}")
            abort "OIDC token request failed: HTTP #{oidc.code}" unless oidc.is_a?(Net::HTTPSuccess)
            jwt = JSON.parse(oidc.body).fetch("value")

            exchange = Net::HTTP.post(
              URI("https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token"),
              JSON.generate(jwt: jwt, owner: ENV.fetch("RUBYGEMS_OWNER_ID")),
              "Content-Type" => "application/json"
            )
            abort "Token exchange failed: HTTP #{exchange.code} #{exchange.body}" unless exchange.is_a?(Net::HTTPSuccess)

            key = JSON.parse(exchange.body).fetch("rubygems_api_key")
            puts "::add-mask::#{key}"
            File.write(ENV.fetch("GITHUB_ENV"), "GEM_HOST_API_KEY=#{key}\n", mode: "a")
          RUBY

      - name: Push gem to RubyGems.org
        run: gem push "nav_online_invoice-${GITHUB_REF_NAME#v}.gem"

  # Separate job, so the write permission is never held next to the RubyGems key.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG.md
        run: |
          ruby -e '
            version = ENV.fetch("TAG").delete_prefix("v")
            notes = File.read("CHANGELOG.md")[/^## \[#{Regexp.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)/m, 1].to_s.strip
            abort "CHANGELOG.md has no notes for #{version}" if notes.empty?
            File.write("release_notes.md", "#{notes}\n")
          '
      - name: Create GitHub release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
