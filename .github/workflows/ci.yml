name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}${{ matrix.gemfile && format(' / {0}', matrix.gemfile) || '' }}
    runs-on: ${{ matrix.os }}
    # The ruby-head row is an early warning for the next Ruby release; it may fail without failing CI.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.3", "3.4", "4.0"]
        gemfile: [""]
        include:
          - os: ubuntu-latest
            ruby: "4.0"
            gemfile: rails_8_1
          - os: windows-latest
            ruby: "4.0"
            gemfile: ""
          - os: ubuntu-latest
            ruby: head
            gemfile: ""
            experimental: true
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile && format('{0}/gemfiles/{1}.gemfile', github.workspace, matrix.gemfile) || format('{0}/Gemfile', github.workspace) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec --format progress --format json --out rspec.json
      - name: Report failed examples as annotations
        if: failure()
        shell: bash
        run: >-
          ruby -rjson -e 'JSON.parse(File.read("rspec.json"))["examples"].select { _1["status"] == "failed" }.each { |e|
          puts "::error file=#{e["file_path"].delete_prefix("./")},line=#{e["line_number"]}::#{e["full_description"]}: #{e.dig("exception", "message").to_s.gsub(/\r?\n/, " ")[0, 900]}" }'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake release:check
