# Keeps the SHA-pinned GitHub Actions and the development gems up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A new release must be a week old, so a compromised one is usually yanked before it reaches us.
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    # A new release must be a week old, so a compromised one is usually yanked before it reaches us.
    cooldown:
      default-days: 7
